syntax = "proto3";

package poker_api;

// Network

// Used for client side deserialization
message HttpResponseWrapper {
    int32 result = 1;
    int32 response_code = 2;
    repeated string response_headers = 3;
    bytes response_body = 4;
}

message ErrorResponse {
    string message = 1;
    string error = 2;
}

// Account

/**
Fields changes that need to be replicated to other tables upon change:
- playerName
- profilePictureUrl
- playerColor
**/

message AccountRecord {
    string accountId = 1;
    string playerName = 2;
    int64 createTimeEpochMilliseconds = 3;
    string profilePictureUrl = 4;
    int32 handsWon = 5;
    int32 handsPlayed = 6;
    string playerColor = 7;
    string friendCode = 8;
}

message AccountRecordList {
  repeated AccountRecord records = 1;
}

// Game

message GameRecord {
    string gameId = 1;
    string hostAccountId = 2;
    string hostName = 3;
    GameStatus gameStatus = 4;
    int64 createTimeEpochMilliseconds = 5;
    int64 endTimeEpochMilliseconds = 6;
    int32 port = 7;
    int32 blindChips = 8;
    int32 buyInChips = 9;
    int32 chipRatio = 10;
    int32 handsPlayed = 11; 
    repeated string connectedPlayers = 12;
    GamePrivacy gamePrivacy = 13;
}

message GameRecordList {
  repeated GameRecord records = 1;
}

enum GameStatus {
    STARTING = 0;
    ACTIVE = 1;
    ENDED = 2;
}

enum GamePrivacy {
    PUBLIC = 0; // Anyone can join as long as they know the game id
    FRIENDS = 1; // Only friends of the host can join
    INVITE = 2; // Only players with an invite code can join (TBD)
    PRIVATE = 3; // Only host can join, play against bots
}

// JoinToken

message JoinTokenRecord {
    string accountId = 1;
    string gameId = 2;
    string joinToken = 3;
}

// Friends

message FriendRecord {
    string accountId = 1;
    string peerAccountId = 2;
    FriendStatus friendStatus = 3;
    string peerPlayerName = 4;
    string peerProfilePictureUrl = 5;
    string peerPlayerColor = 6;
    int64 createTimeEpochMilliseconds = 7;
}

message FriendRecordList {
    repeated FriendRecord friends = 1;
}

enum FriendStatus {
    FRIEND = 0;
    OUTGOING_PENDING = 1;
    INCOMING_PENDING = 2;
    BLOCKED = 3;
    FAVORITE = 4;
}